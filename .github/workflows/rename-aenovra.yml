name: Rename aenovra.html to index.html

on:
  push:
    paths:
      - .github/workflows/rename-aenovra.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename aenovra.html to index.html and commit
        run: |
          git config user.name "nugian10"
          git config user.email "nugian10@users.noreply.github.com"
          git mv aenovra.html index.html
          git commit -m "AENOVRA site: hapus bagian Beda dan Demo Undian"
          git push
